<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
    <!-- Título e metatags serão definidos dinamicamente pelo JS -->
    
    <!-- Favicon -->
    <link rel="icon" href="./imgs/favicon.ico" type="image/x-icon">
  
    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css" />
  
    <!-- JS do projeto -->
    <script type="module" src="./js/pages/projeto.js" defer></script>
  </head>
  

  <body class="projeto-page">

    <header class="header">
      <div class="container">
        <a [data-menu="logo"] class="home-link" href="/">
          <span data-menu="logo">Storrer Tamburus</span>
          <span class="visually-hidden">Voltar para a página inicial</span>
        </a>

        <!-- Menus -->
        <div class="navigation">
          <!-- Menu Institucional -->
          <nav class="institutional-nav" aria-label="Navegação institucional">
            <ul class="menu-institutional">
              <li><a href="/projetos.html">Projetos</a></li>
              <li><a href="/sobre">Sobre</a></li>
              <li><a href="/contato">Contato</a></li>
              <li> 
                <a href="https://www.instagram.com/storrertamburus/" target="_blank">
                  <img src="./imgs/icones/instagram.svg" alt="icone Instagram" width="32" height="32" loading="lazy">
                </a>
              </li>
            </ul>
          </nav>
          <!-- Menu Projetos -->
          <nav class="projetos-nav">
            <ul id="menu-projetos" role="menubar" data-menu="list-projetos">
              <!-- Os itens serão inseridos dinamicamente -->
            </ul>                        
          </nav>
        </div> 

        <!-- Botão Menu -->
        <button data-menu='button-menu' aria-label="Abrir menu" aria-controls="menu" aria-expanded="false">
          <span id="hamburguer"></span>
        </button> 
      </div>
    </header>
    
    <main>
      <section id="projeto-detalhe" class="projeto-conteudo">
        <h1 id="projeto-titulo" class="projeto-titulo">
          <span class="barra"></span>
          <span class="texto"></span>
        </h1>                
        <div id="projeto-imagens" class="galeria-projetos">
          <!-- O Swiper será inserido aqui via JavaScript -->
        </div>
      </section>
    </main>
   
  </body>
</html>
